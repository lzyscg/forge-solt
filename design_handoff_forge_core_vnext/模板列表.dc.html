<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/classical-77148255-5e00-4a2c-957b-cef734727482/styles.css">
<script src="_ds/classical-77148255-5e00-4a2c-957b-cef734727482/_ds_bundle.js"></script>
<style>
body { margin: 0; overflow: hidden; }
a { color: var(--color-accent); }
a:hover { color: var(--color-accent-700); }
.btn { white-space: nowrap; }
nav [title] { cursor: pointer; }
nav [title]:hover { background: color-mix(in srgb, var(--color-accent) 8%, transparent); }
.fc-scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--color-neutral-400) transparent; }
.fc-card:hover { border-color: var(--color-accent) !important; }
</style>
</helmet>

<div style="height: 100vh; display: flex; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 14px; overflow: hidden;">

  <nav style="width: 68px; flex: none; border-right: 1px solid var(--color-divider); display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 6px; background: color-mix(in srgb, var(--color-surface) 55%, transparent);">
    <div style="font-family: var(--font-heading); font-size: 19px; line-height: 1; color: var(--color-accent); margin-bottom: 20px;">F</div>
    <div onClick="{{ nav.tasks }}" title="生产任务" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--radius-md); color: var(--color-neutral-600);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path><path d="m6.08 11-3.5 1.6a1 1 0 0 0 0 1.81l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9a1 1 0 0 0 0-1.83L17.9 11"></path></svg>
    </div>
    <div onClick="{{ nav.templates }}" title="模板" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--radius-md); color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v5h5"></path><path d="M9 13h6"></path><path d="M9 17h4"></path></svg>
    </div>
    <div onClick="{{ nav.settings }}" title="设置" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--radius-md); color: var(--color-neutral-600);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10"></path><path d="M18 6h2"></path><path d="M4 12h4"></path><path d="M12 12h8"></path><path d="M4 18h10"></path><path d="M18 18h2"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="16" cy="18" r="2"></circle></svg>
    </div>
  </nav>

  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">

    <header style="flex: none; padding: 22px 32px 18px; border-bottom: 1px solid var(--color-divider); display: flex; align-items: flex-end; gap: 24px;">
      <div>
        <h3 style="margin: 0; font-size: 26px;">结构模板</h3>
        <div style="margin-top: 7px; font-size: 12.5px; color: var(--color-neutral-600); max-width: 560px; text-wrap: pretty;">模板定义槽位树与每个槽位的 Assignment。任务运行时读的是模板的某个已发布版本，模板改动不影响在跑的任务。</div>
      </div>
      <div style="margin-left: auto; flex: none; display: flex; align-items: center; gap: 10px;">
        <button class="btn btn-secondary">导入 JSON</button>
        <button class="btn btn-primary">新建模板</button>
      </div>
    </header>

    <div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 13px 32px; border-bottom: 1px solid var(--color-divider); background: color-mix(in srgb, var(--color-surface) 40%, transparent);">
      <span style="font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-neutral-500); margin-right: 6px;">产出类型</span>
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
        <button onClick="{{ f.onClick }}" style="{{ f.style }}">{{ f.label }}</button>
      </sc-for>
      <span style="margin-left: auto; font-size: 12.5px; color: var(--color-neutral-600); font-feature-settings: 'tnum';">{{ countLabel }}</span>
    </div>

    <div class="fc-scroll" style="flex: 1; min-height: 0; padding: 26px 32px 40px;">
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px;">
        <sc-for list="{{ cards }}" as="c" hint-placeholder-count="6">
          <div class="fc-card card" onClick="{{ nav.tplDetail }}" style="border: 1px solid var(--color-divider); border-radius: var(--radius-md); padding: 20px 21px 18px; cursor: pointer; transition: border-color .15s; display: flex; flex-direction: column; gap: 14px;">
            <div>
              <div style="display: flex; align-items: baseline; gap: 9px;">
                <span style="font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-neutral-500);">{{ c.output }}</span>
                <span style="margin-left: auto; font-size: 11.5px; color: var(--color-neutral-500); font-feature-settings: 'tnum';">{{ c.version }}</span>
              </div>
              <h4 style="margin: 7px 0 0; font-size: 19px;">{{ c.name }}</h4>
              <div style="margin-top: 6px; font-size: 12.5px; color: var(--color-neutral-700); line-height: 1.7; text-wrap: pretty;">{{ c.desc }}</div>
            </div>

            <div style="display: flex; gap: 26px; padding-top: 13px; border-top: 1px solid var(--color-divider);">
              <div>
                <div style="font-family: var(--font-heading); font-size: 20px; font-feature-settings: 'tnum';">{{ c.slots }}</div>
                <div style="font-size: 11px; color: var(--color-neutral-500); margin-top: 1px;">槽位</div>
              </div>
              <div>
                <div style="font-family: var(--font-heading); font-size: 20px; font-feature-settings: 'tnum';">{{ c.agents }}</div>
                <div style="font-size: 11px; color: var(--color-neutral-500); margin-top: 1px;">Agent</div>
              </div>
              <div>
                <div style="font-family: var(--font-heading); font-size: 20px; font-feature-settings: 'tnum';">{{ c.skills }}</div>
                <div style="font-size: 11px; color: var(--color-neutral-500); margin-top: 1px;">Skill</div>
              </div>
              <div style="margin-left: auto; text-align: right;">
                <div style="font-family: var(--font-heading); font-size: 20px; font-feature-settings: 'tnum';">{{ c.runs }}</div>
                <div style="font-size: 11px; color: var(--color-neutral-500); margin-top: 1px;">已跑任务</div>
              </div>
            </div>

            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
              <sc-for list="{{ c.tags }}" as="t" hint-placeholder-count="3">
                <span class="tag tag-outline" style="font-size: 11px;">{{ t }}</span>
              </sc-for>
            </div>

            <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--color-neutral-500);">
              <span style="{{ c.stateStyle }}">{{ c.state }}</span>
              <span>·</span>
              <span>{{ c.updated }}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const TPLS = [
  { name: "知乎盐选单章 v4", output: "单章正文", version: "v4 · 已发布", slots: 6, agents: 2, skills: 3, runs: 41,
    desc: "章节骨架先行，三段场景正文并行填充，章末钩子收口后组装成整章。",
    tags: ["结构 Agent", "写作 Agent", "章节骨架 Skill", "场景正文 Skill"], state: "已发布", tone: "ok", updated: "3 天前更新", type: "正文" },
  { name: "长篇书籍骨架 v2", output: "全书大纲", version: "v2 · 已发布", slots: 9, agents: 2, skills: 4, runs: 7,
    desc: "世界观与人物设定作为前置依赖，分卷大纲与章节清单在其上展开。含两层容器槽位。",
    tags: ["设定 Agent", "结构 Agent", "人物卡 Skill"], state: "已发布", tone: "ok", updated: "上周更新", type: "大纲" },
  { name: "商业长文 v1", output: "论述长文", version: "v1 · 已发布", slots: 5, agents: 1, skills: 3, runs: 23,
    desc: "立论段冻结全文论点，三段论证读取同一立论快照，收束段回扣。",
    tags: ["论述 Agent", "立论 Skill", "论证段 Skill"], state: "已发布", tone: "ok", updated: "2 周前更新", type: "长文" },
  { name: "音频脚本 v1", output: "播客脚本", version: "v1 · 已发布", slots: 7, agents: 2, skills: 3, runs: 12,
    desc: "选题卡 → 提纲 → 口播正文分段 → 片头片尾。正文段按时长配额切分。",
    tags: ["策划 Agent", "口播 Agent", "口播正文 Skill"], state: "已发布", tone: "ok", updated: "2 周前更新", type: "脚本" },
  { name: "短篇合集 v1", output: "短篇集", version: "v1 · 草稿", slots: 12, agents: 3, skills: 5, runs: 0,
    desc: "四个短篇各自独立生产，末尾编者按读取全部短篇摘要。容器槽位嵌套三层。",
    tags: ["写作 Agent", "编辑 Agent", "编者按 Skill"], state: "草稿", tone: "draft", updated: "昨天更新", type: "正文" },
  { name: "知乎盐选单章 v3", output: "单章正文", version: "v3 · 已归档", slots: 5, agents: 2, skills: 3, runs: 86,
    desc: "v4 的前身，无独立章末钩子槽位。仍有 3 个历史任务引用该版本。",
    tags: ["结构 Agent", "写作 Agent"], state: "已归档", tone: "arch", updated: "1 个月前", type: "正文" },
];

const STATE_STYLE = {
  ok: "color: var(--color-accent-700);",
  draft: "color: var(--color-neutral-700);",
  arch: "color: var(--color-neutral-500);",
};

const FILTERS = ["全部", "正文", "大纲", "长文", "脚本"];

const GO = p => () => { window.location.href = p; };
const NAV = {
  tasks: GO("任务列表.dc.html"),
  templates: GO("模板列表.dc.html"),
  settings: GO("Provider%20设置.dc.html"),
  tplDetail: GO("模板详情.dc.html"),
};

class Component extends DCLogic {
  state = { filter: "全部" };

  renderVals() {
    const cards = TPLS.filter(t => this.state.filter === "全部" || t.type === this.state.filter);
    return {
      nav: NAV,
      countLabel: `${cards.length} 个模板`,
      cards: cards.map(t => ({ ...t, stateStyle: STATE_STYLE[t.tone] })),
      filters: FILTERS.map(label => ({
        label,
        onClick: () => this.setState({ filter: label }),
        style: this.state.filter === label
          ? "padding: 4px 11px; border: 1px solid var(--color-accent); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--color-accent) 9%, transparent); color: var(--color-accent-700); font-family: var(--font-body); font-size: 12.5px; cursor: pointer;"
          : "padding: 4px 11px; border: 1px solid var(--color-divider); border-radius: var(--radius-sm); background: transparent; color: var(--color-neutral-600); font-family: var(--font-body); font-size: 12.5px; cursor: pointer;",
      })),
    };
  }
}

</script>
</body>
</html>
