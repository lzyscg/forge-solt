# Provider 定义与模型别名映射（文档 D-03 / D-17）
#
# 安全约束：本文件受版本控制，只允许出现环境变量【名称】（apiKeyEnv），
# 绝不允许出现 API Key 的值。运行时由 ProviderRegistry 从 process.env 读取。
#
# 别名（aliases）是快照冻结的单位：任务快照里冻结的是别名，不是具体模型。
# 别名 → 具体 provider/model 的解析发生在执行时（late-bound），
# 这样换模型不需要重建历史快照，而历史任务仍能忠实记录它当时用的是哪个别名。

providers:
  - id: deepseek
    name: DeepSeek
    kind: openai-compatible # 决定用哪个 adapter（D-17）
    baseUrl: https://api.deepseek.com/v1
    apiKeyEnv: DEEPSEEK_API_KEY # 只写环境变量名，绝不写值
    models:
      # M4 实测（2026-08-21）：`/v1/models` 现在只回 v4 三个型号。
      # 旧名 deepseek-chat / deepseek-reasoner 仍然可用，但**两者都解析到
      # deepseek-v4-flash**——请求 deepseek-reasoner，响应的 model 字段回的是 v4-flash。
      # 这意味着 D-17 的 L3「切到推理型号」按旧名执行是**空操作**：
      # 模型没变、通过率不会变，而且不会报错。真正更强的型号是 deepseek-v4-pro。
      - deepseek-chat # = deepseek-v4-flash（服务端别名）
      - deepseek-v4-flash
      - deepseek-v4-pro # D-17 L3 的目标型号：结构通过率不达标时切这个

  # OpenCode Go —— 订阅制套餐（D-17 补正，业务方要求接入并设为默认）
  #
  # ⚠️ baseUrl 必须是 /zen/go/v1，**不是** /zen/v1。这两个是不同的产品：
  #    - /zen/v1     按量付费，扣「可用余额」
  #    - /zen/go/v1  Go 订阅套餐，走套餐配额
  #    打错的现象极具误导性：/zen/v1 会回 401 CreditsError「余额不足」，
  #    让人以为是套餐没生效或没充值，而实际上 Go 订阅是好的、配额也没用完。
  #    （接入当日就踩了这一脚：先按 /zen/v1 接，401，差点得出「Key 不可用」的结论。）
  #
  # ⚠️ models 列表刻意只列走 /chat/completions 的那一族。上游按模型家族分路：
  #    GPT/Grok → /v1/responses、Claude/Qwen → /v1/messages、
  #    Gemini → /v1/models/gemini-*，只有 DeepSeek/Kimi/GLM/MiniMax 走
  #    /chat/completions，而我们的 openai-compatible 适配器写死打后者。
  #    在这里列一个 claude-* 或 gpt-* 会通过加载期校验，然后在**运行期**才失败——
  #    那时烧掉的是一次真实的 Assignment。别加。
  #
  # 实测（接入当日，经 /zen/go/v1）：chat/completions 200 ·
  # 流式 12 分片 · tool_calls 正确分片下发且 arguments 增量可拼装。
  - id: opencode-go
    name: OpenCode Go
    kind: openai-compatible
    baseUrl: https://opencode.ai/zen/go/v1
    apiKeyEnv: OPENCODE_API_KEY # 只写变量名，值在 .env（REQ §13）
    models:
      - deepseek-v4-flash # 业务方指定：Go 套餐内额度充裕
      - deepseek-v4-pro # D-17 L3 的目标型号，同样在 Go 套餐内

  # 火山方舟 Coding Plan —— 订阅制套餐（2026-08-31 接入）
  #
  # ⚠️⚠️ baseUrl 必须是 /api/coding/v3，**不是** /api/v3。文档原文：
  #    「请勿使用 https://ark.cn-beijing.volces.com/api/v3：该 Base URL
  #      不会消耗您的 Coding Plan 额度，而是会产生额外费用。」
  #
  #    这和上面 OpenCode 的 /zen/v1 vs /zen/go/v1 是同一类陷阱，但**更阴险**：
  #      - OpenCode 打错 → 401「余额不足」，吵得很大声，当天就查出来了；
  #      - 火山打错   → **不报错、照常返回结果、账单另算**。
  #    也就是说这个错误没有任何运行期信号，除非去对账，否则跑几周都发现不了。
  #    改这一行之前，先想清楚你是在往哪个口袋里掏钱。
  #
  # models 列表照录文档「模型配置」一节，全部实打验证过，不是抄文档。
  # 验证脚本：probe/ark-coding-plan.ts（结果 probe/results-ark-coding-plan.json）
  # 每个模型都真发了一次带嵌套数组 + 中文 + 多参数的 complete_assignment 工具调用。
  #
  # 实测（2026-08-31，各模型 n=2，同一份 prompt）：
  #
  #   模型                    吞吐 tok/s    首帧 ms      tool_calls
  #   deepseek-v4-flash       93.1 / 96.8   1817 / 1601  ✅ 逐字命中 2/2
  #   deepseek-v4-pro         63.7 / 55.2   1212 / 1132  ✅
  #   glm-5.3                 35.7 / 32.2   3903 / 5491  ✅
  #   glm-5.3-flash           33.4 / 28.8   5136 / 5145  ✅
  #   kimi-k2.7-code          36.1 / 34.8   1086 / 1089  ✅
  #   minimax-m3             109.6 /109.9    652 / 1095  ✅（见下方注意）
  #   doubao-seed-evolving    38.3 / 33.5    481 / 1540  ✅
  #   doubao-seed-2.1-turbo   54.0 / 49.2    562 /  764  ✅
  #   doubao-seed-2.0-lite    96.7 / 95.0    864 /  669  ✅
  #
  #   对照基线 —— DeepSeek 官方 deepseek-chat：106 tok/s，首帧 139ms。
  #
  # 结论：**吞吐不是问题**（v4-flash 93~97 对官方 106，差约 10%），
  # 这与 OpenCode Go 那次（14.5 字/秒，单章 23 分钟）完全不是一回事。
  # 代价在**首帧延迟**：1.6~1.8 秒 vs 官方 0.14 秒，约 12 倍，是套餐排队。
  # 一章约 16 次执行，折算每章多等 20~25 秒，可接受。
  #
  # ⚠️ minimax-m3 的 SSE 分帧与众不同：整轮只有 14 帧（其余模型几百帧），
  #    tool_calls 基本是**整块下发**而不是逐字增量。拼装结果正确，但这意味着
  #    用它跑时 onTextDelta 会长时间没有动静、然后一次性涌出。
  #    前端进度呈现若依赖 delta 节奏，在这个模型上会显得像卡住了。
  #
  # 全部 9 个模型：0 个丢弃分片（onDroppedChunk 无信号），
  # oldText 逐字命中 2/2 —— D-62 那条编辑清单契约在这 9 个模型上都成立。
  - id: volcengine-ark-coding
    name: 火山方舟 Coding Plan
    kind: openai-compatible
    baseUrl: https://ark.cn-beijing.volces.com/api/coding/v3
    apiKeyEnv: ARK_API_KEY # 只写变量名，值在 .env（REQ §13）
    models:
      - deepseek-v4-flash # 与官方 deepseek-chat 同一个模型，换计费通道
      - deepseek-v4-pro
      - glm-5.3
      - glm-5.3-flash
      - kimi-k2.7-code
      - minimax-m3
      - doubao-seed-evolving
      - doubao-seed-2.1-turbo
      - doubao-seed-2.0-lite

  # 优云智算 Coding Plan —— 订阅制套餐，**按调用次数计费**（2026-08-31 接入，备用）
  #
  # ⚠️⚠️ baseUrl 必须是 cp.compshare.cn/v1，**不是**文档里那个 api.modelverse.cn/v1。
  #    控制台原文：「务必使用 Coding Plan 支持的模型及 Base URL；如未使用指定的
  #    Base URL，将无法使用 Coding Plan 额度，并可能产生额外 API 请求的费用。」
  #
  #    这是**第三家**同形状的坑了。规律很清楚：三家都把通用地址放在文档显眼处、
  #    把套餐地址藏在控制台里。**接下一家时，baseUrl 一律从控制台原样复制，
  #    不许从文档推、不许凭印象写。**
  #
  # ── 与前两家本质不同：这家按「调用次数」扣，与 token 无关 ──────────
  #
  # 文档原文：「以调用次数为单位，与 Token 数量无关」「一次调用 = 1 次扣减，
  # 乘以模型倍率」。而我们一章约 **143 次工具调用**（R6 真跑：48 次执行 /
  # 143 次工具调用），每次调用都要乘倍率：
  #
  #   模型                      倍率   一章实扣   Mini(1900) 能跑
  #   Qwen3.8-27B               0.5×      72 次    ~26 章/月
  #   MiniMax-M2.7              2×       286 次    ~6.6 章/月
  #   deepseek-v4-flash-0731    3×       429 次    ~4.4 章/月
  #   kimi-k2.6                 5×       715 次    ~2.7 章/月
  #   glm-5.1 / glm-5.2         6×       858 次    ~2.2 章/月
  #
  # **这个计费模型和本项目的用法是错配的。** 我们的 Agent 循环要反复读大纲、
  # 读 Skill 章节、读依赖正文，这些调用几乎不产出 token 却照样按次扣。
  # 按 token 算我们一章 63 万 in / 2.7 万 out（重复上下文有缓存优惠空间），
  # 按次算则每多读一次就多扣一次。同样的活，我们比对话类应用吃亏得多。
  #
  # 定位：**备用**。够「火山挂了时把手上这一章跑完」，不够支撑 Skill 迭代
  # （一轮整跑就是 143 次调用 × 倍率）。
  #
  # ── 实测（2026-08-31，n=2，同一份 prompt，与前两家同一个探针）────────
  #
  #   deepseek-v4-flash-0731   99.0 / 104.5 tok/s   首帧 1851 / 2113ms   ✅ 逐字命中 2/2
  #   Qwen3.8-27B              83.7 /  85.2 tok/s   首帧  306 /  355ms   ✅ 逐字命中 2/2
  #
  #   对照：火山 deepseek-v4-flash 93~97 tok/s，DeepSeek 官方 106 tok/s。
  #   吞吐这一项三家基本打平，不是选型依据。
  #
  # ⚠️ Qwen3.8-27B 的 tool_calls 几乎整块下发（1465 帧里只有 11 帧带 tool_calls，
  #    其余模型是几百帧）。拼装结果正确，但用它跑时前端 delta 会长时间没动静、
  #    然后一次性涌出。与 minimax-m3 是同一类表现。
  #
  # models 只列**实打验证过**的两个，不是把控制台的表照抄。
  # 未测的 MiniMax-M2.7 / kimi-k2.6 / glm-5.1 / glm-5.2 **刻意不列**：
  # 按上面那张表，5×/6× 档一个月只够两章多，真用上的可能性极低，
  # 而列进来就等于允许它们在运行期被选中——那时才失败就来不及了。
  # 要用先跑 probe/provider-onboarding.ts --provider compshare --model <名字>。
  - id: compshare-coding
    name: 优云智算 Coding Plan
    kind: openai-compatible
    baseUrl: https://cp.compshare.cn/v1
    apiKeyEnv: MODELVERSE_API_KEY # 只写变量名，值在 .env（REQ §13）
    models:
      - deepseek-v4-flash-0731 # 注意是带日期的固定快照，与火山的 deepseek-v4-flash 不是同一版本
      - Qwen3.8-27B # 0.5× 倍率，这个套餐里唯一跑得起量的档

# 别名是快照冻结的单位，也是切换 Provider 的唯一开关：
# 模板引用别名，不引用具体 provider/model，所以下面这三处改完，
# 全部模板立刻换用新 Provider，模板文件一个字都不用动。
#
# 【当前】三个别名全部指向火山方舟 Coding Plan（2026-08-31 切换）。
#
# 切过来的依据是实打，不是文档（probe/provider-onboarding.ts）：
#   吞吐  93.1~96.8 tok/s  对照 DeepSeek 官方 106  → 差约 10%
#   首帧  1.6~1.8s         对照 官方 0.14s        → 约 12 倍，套餐排队
#   折算  一章约 16 次执行，多等 20~25 秒
#
# 关键点：**模型没变**。官方的 deepseek-chat 解析到 deepseek-v4-flash，
# 套餐里直接就叫 deepseek-v4-flash，是同一个模型换计费通道。
# 因此切换前后的产物质量可以直接对照，Skill 迭代的历史数据不作废。
# —— 这一条对火山成立，对优云智算**不成立**（那边是带日期的固定快照 -0731）。
#
# 要切回官方：把下面三处的 provider 改回 deepseek、model 改回 deepseek-chat。
# DeepSeek 官方条目保留，按量付费随时可用，适合「赶时间、不在乎钱」的单次跑。
#
# 曾于 2026-08-25 切到 opencode-go，当天切回。原因是实测速度差距过大，
# 严重影响开发测试节奏（同模板同输入同模型）：
#
#   DeepSeek 官方   单章 85.6s（M4 连跑 20 章的基线，最长 110s）
#   OpenCode Go     单章 1370s ≈ 23 分钟         → 约 16 倍
#
# 慢的不是响应延迟（小请求首字 1.2–2.0s，很快），是**生成吞吐**
# （实测约 14.5 字/秒）且方差极大——同一段内容两次耗时能差 2–3 倍。
# 这是低价订阅套餐的定价逻辑，不是故障。
#
# opencode-go 条目**保留**：它适合「能等的批量后台跑」。要切回去改这三处即可。
# 另一个可选形态（当时评估过没做）：结构走官方、正文走 Go——
# 结构一失败整章重来，让它走快的那条，其余走便宜的那条。
aliases:
  # 通用内容生产
  main:
    provider: volcengine-ark-coding
    model: deepseek-v4-flash
  # 槽位类型可通过 template.yaml 的 modelAlias 覆盖到这里（D-06）
  configured:
    provider: volcengine-ark-coding
    model: deepseek-v4-flash
  # 结构设计。若结构提案一次通过率不达标，这里是 D-17 L3 的调节点
  # （套餐内的 deepseek-v4-pro 就是 L3 的目标型号，不用换 Provider）
  structure:
    provider: volcengine-ark-coding
    model: deepseek-v4-flash

# 回退链的最后一级（D-06）：模板没写 limits 时用这里的值。
# 注意没有 defaults.alias——modelAlias 的回退链是
# binding.modelAlias → agent.model → 模板校验失败，**不允许**兜底到某个全局别名。
# 一个默认别名会让「忘了给 agent 配模型」变成静默生效，而不是编译期报错。
defaults:
  timeoutMs: 180000
  maxRetries: 2
  concurrentSlots: 1 # D-04：P0 固定 1，不可配
  # 限流退避是独立配额，不占用 maxRetries（D-04）
  rateLimitBackoff:
    strategy: exponential
    initialMs: 1000
    maxMs: 60000
    maxAttempts: 5
