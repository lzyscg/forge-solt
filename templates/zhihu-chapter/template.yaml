# 合法模板基准夹具（对照文档 §4.1 的完整格式）。
# 每类非法夹具都是这份文件的单点变异，见 tests/fixtures/invalid-templates/。
id: zhihu-chapter
version: 1.0.0
name: 知乎盐选单章结构槽生产
description: 章节结构由 Agent 依据执行包设计，逐槽填充后组装为单章正文。
status: published

presentation: # 纯展示，不进快照，不计入 templateHash（D-02）
  outputKind: 单章正文
  tags: [结构 Agent, 写作 Agent, 场景写作]
  exampleStructure:
    - { name: chapter, typeId: chapter, kind: container, depth: 0 }
    - { name: title, typeId: title, kind: content, depth: 1 }
    - { name: scene_01, typeId: scene, kind: content, depth: 1 }

inputFields:
  - id: chapter_packet
    label: 章节执行包
    type: textarea
    required: true
    hint: 本章的素材、人物状态与情节目标

slotTypes:
  - id: chapter
    name: 章节容器
    description: 承载完整章节结构，不产出正文
    contentBearing: false
    # 结构审核的返修预算（D-26）。**容器类型上的这个数管的是整棵树**——
    # 轮次存在根槽位的 revision_round 上，见 bindings.reviewStructure。
    #
    # 给 3 而不是 scene 的 2：结构错了，下游每一个场景都跟着错，
    # 而结构返修的单价（约 31k input）只有场景的三分之一，多给一轮明显划算。
    #
    # 没给 5 是因为**我们对结构审核的收敛性一个数据点都没有**。
    # 场景那边实测是非单调的（S2 连着三轮各报不同的句子）。3 轮最坏约 93k input，
    # 够看清它收不收敛；5 轮是 155k。改成 5 是这里的一行，退不回已经花掉的钱。
    maxRevisionRounds: 3

  - id: title
    name: 章节标题
    description: 单章标题
    contentBearing: true
    validation:
      minChars: 4
      maxChars: 40

  - id: scene
    name: 场景段
    description: 通过行动、冲突或信息变化推进正文
    contentBearing: true
    validation:
      minChars: 300
      maxChars: 8000
      forbidPattern: '(?m)^#{1,6}\s'
      forbidPatternMessage: 场景正文不得包含 Markdown 小标题
    guidance:
      - 首段需衔接前一场景的结尾状态
      - 通过可见行动推进，不用心理解释代替事件
    # R4 / D-26：返修上限。省略也是 2，这里显式写出来是因为它决定了最坏情况的
    # token 开销（每轮 4 条判据各一次调用 + 一次重写），值得摆在模板里被看见。
    maxRevisionRounds: 2

agents:
  - id: structure_designer
    name: 章节结构设计 Agent
    role: 根据章节执行包设计具体章节结构
    model: structure
    systemInstruction: |
      你负责设计章节的内容结构，不负责撰写正文。

  - id: chapter_writer
    name: 章节写作 Agent
    role: 根据结构槽目标生产章节正文
    model: main
    systemInstruction: |
      你负责撰写单个结构槽的正文，不负责修改结构或其他槽位。

  # R4 / D-27：审核 Agent 与写作 Agent 分开。同一个 Agent 既写又审，
  # 它的 systemInstruction 里会同时装着「你负责写」和「你负责挑错」，
  # 而审核已经有极强的放行先验（R0.5 附录 §3），不该再往同一个方向加码。
  - id: scene_reviewer
    name: 场景审核 Agent
    role: 按判据检查场景正文是否违反写作规范
    model: main
    systemInstruction: |
      你负责按指定判据检查场景槽位的正文，不负责改写正文，也不负责修改结构。

  # 与 scene_reviewer 分开而不是共用一个「审核 Agent」：两者的判断对象根本不同——
  # 结构审的是「下游照着这些目标能不能写出来」，此刻一个字的正文都还没有；
  # 场景审的是「这段正文守没守写作规范」。合成一个，它的 systemInstruction 里
  # 就得同时装下两套标准，而每次调用只用得上其中一套，另一套是纯噪音。
  - id: structure_reviewer
    name: 章节结构审核 Agent
    role: 按判据检查槽位树里各槽位的目标是否违反结构设计规范
    model: main
    systemInstruction: |
      你负责按指定判据检查章节结构里各槽位的目标，不负责设计结构，也不负责撰写正文。

skills:
  - id: chapter-structure-design
    version: 1.0.0
    source: skills/chapter-structure-design/SKILL.md
  - id: title-writing
    version: 1.0.0
    source: skills/title-writing/SKILL.md
  - id: scene-writing
    version: 1.0.0
    source: skills/scene-writing/SKILL.md
  - id: scene-review
    version: 1.0.0
    source: skills/scene-review/SKILL.md
  - id: structure-review
    version: 1.1.0
    source: skills/structure-review/SKILL.md

bindings:
  createStructure:
    agentId: structure_designer
    skillId: chapter-structure-design
    # D-06 覆盖。M4 用这个值连跑 20 章，结构首次通过率 20/20。
    #
    # 曾于 2026-08-25 抬到 240000 以适配 OpenCode Go，当天随 Provider 一起改回。
    # 超时是「任务永久 running」的最后一道网，给慢 Provider 让路会让真卡住时
    # 晚 4 分钟才发现——那套预算只在跑 Go 时才成立，见 Q-27。
    timeoutMs: 90000
    maxRetries: 2

  fillSlotByType:
    title:
      agentId: chapter_writer
      skillId: title-writing
      # 未指定 timeoutMs / maxRetries：走 limits 默认
    scene:
      agentId: chapter_writer
      skillId: scene-writing
      # 曾于 2026-08-25 抬到 420000 适配 OpenCode Go，当天改回（见 Q-27）。
      timeoutMs: 180000
      maxRetries: 1

  # R4 / D-27：审核按 Slot Type 可选绑定。**只给 scene 绑**——
  # R0.5 的实测只覆盖场景正文，给 title 开审核没有任何证据支持，
  # 而「默认全开」意味着为没测过的场景付 token 并承担未知误报。
  # 这里不写 timeoutMs：审核一次调用约 1s（R0.5 实测），走 limits 的 120s 绰绰有余。
  reviewSlotByType:
    scene:
      agentId: scene_reviewer
      skillId: scene-review
      maxRetries: 1

  # R5：结构审核。审的是根容器底下**整棵树**的槽位目标，不是某个槽位的正文，
  # 所以它是一条独立绑定而不是 reviewSlotByType 里的一项
  # （那张表的 key 是槽位类型，表达不出「只对根」）。
  #
  # 时机：确定性校验通过、槽位落库之后，**第一个槽位开填之前**。
  # 检出问题就整棵树重来，此时写作 token 一个都还没花——
  # 这正是把审核放在这个位置的全部理由。返修预算在 chapter 槽位类型的
  # maxRevisionRounds 上（轮次存在根槽位的 revision_round 里）。
  reviewStructure:
    agentId: structure_reviewer
    skillId: structure-review
    maxRetries: 1

limits:
  maxSlots: 32
  maxStructureDepth: 4
  maxExecutionRetries: 2
  # 回退链的一级：title 用它（没写 timeoutMs）。
  # 曾于 2026-08-25 抬到 240000 适配 OpenCode Go，当天改回（见 Q-27）。
  #
  # 留一条从那次实测得到、与 Provider 无关的观察：title 只产出 5 个字却花了 53s，
  # 耗时由**工具调用往返次数**主导而非生成量。
  # 所以「这个槽输出短」不是给它短预算的理由——这个推理方向本身是错的。
  executionTimeoutMs: 120000
  maxToolCallsPerAssignment: 24

output:
  fileName: chapter.md
  mediaType: text/markdown
  assembler: markdown_concat_v1
