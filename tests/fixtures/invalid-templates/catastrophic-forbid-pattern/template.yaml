# 非法：forbidPattern 是一个会灾难性回溯的正则。
# `^(\w+\s?)+$` 配上「几 KB 正文 + 末尾一个不匹配字符」会让 V8 回溯到天荒地老，
# 而它跑的正是模型生成的长文本。P0 只有一条串行生产线，主线程被钉死等于全站停摆。
# 因此这类模板必须在加载期就被拒绝，不能等到线上。
id: catastrophic-forbid-pattern
version: 1.0.0
name: 会灾难性回溯的正则
description: 用于验证 forbidPattern 的时间预算闸门。
status: published

presentation:
  outputKind: 单章正文

inputFields:
  - id: chapter_packet
    label: 章节执行包
    type: textarea
    required: true

slotTypes:
  - id: scene
    name: 场景段
    description: 推进正文的场景
    contentBearing: true
    validation:
      forbidPattern: '^(\w+\s?)+$'
      forbidPatternMessage: 场景正文不得整段为单行词串

agents:
  - id: structure_designer
    name: 结构设计 Agent
    role: 设计章节结构
    model: structure
    systemInstruction: 你负责设计结构。
  - id: chapter_writer
    name: 写作 Agent
    role: 生产正文
    model: main
    systemInstruction: 你负责撰写正文。

skills:
  - id: chapter-structure-design
    version: 1.0.0
    source: skills/chapter-structure-design/SKILL.md
  - id: scene-writing
    version: 1.0.0
    source: skills/scene-writing/SKILL.md

bindings:
  createStructure:
    agentId: structure_designer
    skillId: chapter-structure-design
  fillSlotByType:
    scene:
      agentId: chapter_writer
      skillId: scene-writing

limits:
  maxSlots: 16
  maxStructureDepth: 3
  maxToolCallsPerAssignment: 24

output:
  fileName: chapter.md
  mediaType: text/markdown
  assembler: markdown_concat_v1
