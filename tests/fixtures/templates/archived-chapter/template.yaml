# 最小合法模板，status=archived。历史任务仍引用其快照，故不可硬删（D-08）。
id: archived-chapter
version: 0.9.0
name: 已归档章节模板
description: 已被新版本取代，保留供历史任务查阅。
status: archived

presentation:
  outputKind: 单章正文

inputFields:
  - id: chapter_packet
    label: 章节执行包
    type: textarea
    required: true

slotTypes:
  - id: chapter
    name: 章节容器
    description: 承载完整章节结构
    contentBearing: false
  - id: scene
    name: 场景段
    description: 推进正文的场景
    contentBearing: true

agents:
  - id: structure_designer
    name: 结构设计 Agent
    role: 设计章节结构
    model: structure
    systemInstruction: 你负责设计结构。
  - id: chapter_writer
    name: 写作 Agent
    role: 生产正文
    model: main
    systemInstruction: 你负责撰写正文。

skills:
  - id: chapter-structure-design
    version: 1.0.0
    source: skills/chapter-structure-design/SKILL.md
  - id: scene-writing
    version: 1.0.0
    source: skills/scene-writing/SKILL.md

bindings:
  createStructure:
    agentId: structure_designer
    skillId: chapter-structure-design
  fillSlotByType:
    scene:
      agentId: chapter_writer
      skillId: scene-writing

limits:
  maxSlots: 16
  maxStructureDepth: 3
  maxToolCallsPerAssignment: 24

output:
  fileName: chapter.md
  mediaType: text/markdown
  assembler: markdown_concat_v1
